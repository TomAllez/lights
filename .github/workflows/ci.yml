name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgles2 libegl1
          pip install mediapipe numpy

      - run: yarn install --frozen-lockfile

      - run: yarn nx run-many -t lint test

  e2e:
    runs-on: ubuntu-latest
    needs: main
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - name: Install Electron system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libglib2.0-0 libnss3 libnspr4 \
            libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libasound2t64 || sudo apt-get install -y -qq libasound2

      - name: Build Electron app
        run: yarn nx build @lights/app

      - name: Run e2e tests
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" yarn nx e2e @lights/e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/ts/e2e/playwright-report/
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: packages/ts/e2e/test-results/
          retention-days: 7
