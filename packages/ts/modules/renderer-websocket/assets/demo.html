<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lights — WebSocket Renderer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111;
      color: #eee;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 12px;
    }
    canvas { display: block; border: 1px solid #333; }
    #status { font-size: 13px; color: #888; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="status">Connecting…</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');

    let width = 0;
    let height = 0;
    let frames = 0;
    let fpsTimer = Date.now();
    let fps = 0;

    // Hand landmark connections (MediaPipe Hands topology)
    const CONNECTIONS = [
      [0,1],[1,2],[2,3],[3,4],         // thumb
      [0,5],[5,6],[6,7],[7,8],         // index
      [0,9],[9,10],[10,11],[11,12],    // middle
      [0,13],[13,14],[14,15],[15,16],  // ring
      [0,17],[17,18],[18,19],[19,20],  // pinky
      [5,9],[9,13],[13,17],            // palm
    ];

    // Latest hands state, reset on each video frame
    let pendingHands = [];

    function decodeHandpose(data) {
      // data: Uint8Array — byte 0 = handedness (0=Left,1=Right), then 21×3 float32 LE
      const view = new DataView(data.buffer, data.byteOffset);
      const handedness = data[0] === 1 ? 'Right' : 'Left';
      const landmarks = [];
      for (let i = 0; i < 21; i++) {
        const off = 1 + i * 12;
        landmarks.push({
          x: view.getFloat32(off,     true),
          y: view.getFloat32(off + 4, true),
          z: view.getFloat32(off + 8, true),
        });
      }
      return { handedness, landmarks };
    }

    function drawHands(hands) {
      for (const { handedness, landmarks } of hands) {
        const color = handedness === 'Right' ? '#00e676' : '#40c4ff';

        // Connections
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        for (const [a, b] of CONNECTIONS) {
          const la = landmarks[a];
          const lb = landmarks[b];
          ctx.beginPath();
          ctx.moveTo(la.x * width, la.y * height);
          ctx.lineTo(lb.x * width, lb.y * height);
          ctx.stroke();
        }

        // Landmark dots
        for (const lm of landmarks) {
          ctx.beginPath();
          ctx.arc(lm.x * width, lm.y * height, 4, 0, Math.PI * 2);
          ctx.fillStyle = color;
          ctx.fill();
        }
      }
    }

    const ws = new WebSocket(`ws://localhost:3000`);
    ws.binaryType = 'arraybuffer';

    ws.onopen  = () => { status.textContent = 'Connected — waiting for config…'; };
    ws.onclose = () => { status.textContent = 'Disconnected'; };
    ws.onerror = () => { status.textContent = 'Connection error'; };

    ws.onmessage = (event) => {
      // JSON messages: config or events
      if (typeof event.data === 'string') {
        const msg = JSON.parse(event.data);

        if (msg.type === 'config') {
          width = msg.width;
          height = msg.height;
          canvas.width = width;
          canvas.height = height;
          status.textContent = `${width}×${height} — waiting for frames…`;
          return;
        }

        if (msg.type === 'events') {
          pendingHands = msg.events
            .filter(e => e.type === 'handpose')
            .map(e => decodeHandpose(new Uint8Array(e.data)));
          return;
        }

        return;
      }

      // Binary frame: raw RGB24 pixel data
      if (!width || !height) return;
      const rgb = new Uint8Array(event.data);
      const rgba = new Uint8ClampedArray(width * height * 4);

      for (let i = 0; i < width * height; i++) {
        rgba[i * 4]     = rgb[i * 3];
        rgba[i * 4 + 1] = rgb[i * 3 + 1];
        rgba[i * 4 + 2] = rgb[i * 3 + 2];
        rgba[i * 4 + 3] = 255;
      }

      ctx.putImageData(new ImageData(rgba, width, height), 0, 0);
      drawHands(pendingHands);
      pendingHands = [];

      frames++;
      const now = Date.now();
      if (now - fpsTimer >= 1000) {
        fps = Math.round(frames * 1000 / (now - fpsTimer));
        frames = 0;
        fpsTimer = now;
        status.textContent = `${width}×${height} — ${fps} fps`;
      }
    };
  </script>
</body>
</html>
