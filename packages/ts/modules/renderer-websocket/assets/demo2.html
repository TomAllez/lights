<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lights — Face Mesh</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111;
      color: #eee;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 12px;
    }
    canvas { display: block; border: 1px solid #333; }
    #status { font-size: 13px; color: #888; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="status">Connecting…</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx    = canvas.getContext('2d');
    const status = document.getElementById('status');

    let width = 0, height = 0;
    let frames = 0, fpsTimer = Date.now(), fps = 0;
    let pendingFaces = [];

    // ── MediaPipe FaceMesh connection topology ──────────────────────────────

    const FACE_OVAL = [
      [10,338],[338,297],[297,332],[332,284],[284,251],[251,389],[389,356],
      [356,454],[454,323],[323,361],[361,288],[288,397],[397,365],[365,379],
      [379,380],[380,381],[381,382],[382,362],
      [10,109],[109,67],[67,103],[103,54],[54,21],[21,162],[162,127],[127,234],
      [234,93],[93,132],[132,58],[58,172],[172,136],[136,150],[150,149],
      [149,176],[176,148],[148,152],[152,377],[377,400],[400,378],[378,379],
    ];

    const LEFT_EYE = [
      [263,249],[249,390],[390,373],[373,374],[374,380],[380,381],[381,382],[382,362],
      [263,466],[466,388],[388,387],[387,386],[386,385],[385,384],[384,398],[398,362],
    ];

    const RIGHT_EYE = [
      [33,7],[7,163],[163,144],[144,145],[145,153],[153,154],[154,155],[155,133],
      [33,246],[246,161],[161,160],[160,159],[159,158],[158,157],[157,173],[173,133],
    ];

    const LEFT_EYEBROW = [
      [276,283],[283,282],[282,295],[295,285],
      [300,293],[293,334],[334,296],[296,336],
    ];

    const RIGHT_EYEBROW = [
      [46,53],[53,52],[52,65],[65,55],
      [70,63],[63,105],[105,66],[66,107],
    ];

    const LIPS = [
      // outer
      [61,146],[146,91],[91,181],[181,84],[84,17],[17,314],[314,405],[405,321],
      [321,375],[375,291],[61,185],[185,40],[40,39],[39,37],[37,0],[0,267],
      [267,269],[269,270],[270,409],[409,291],
      // inner
      [78,95],[95,88],[88,178],[178,87],[87,14],[14,317],[317,402],[402,318],
      [318,324],[324,308],[78,191],[191,80],[80,81],[81,82],[82,13],[13,312],
      [312,311],[311,310],[310,415],[415,308],
    ];

    const NOSE = [
      [168,6],[6,197],[197,195],[195,5],[5,4],[4,1],[1,19],[19,94],[94,2],
      [2,164],[164,0],
    ];

    const FEATURES = [
      { connections: FACE_OVAL,     color: 'rgba(255,255,255,0.5)', width: 1   },
      { connections: LEFT_EYE,      color: '#00e5ff',               width: 1.5 },
      { connections: RIGHT_EYE,     color: '#00e5ff',               width: 1.5 },
      { connections: LEFT_EYEBROW,  color: '#ffea00',               width: 1.5 },
      { connections: RIGHT_EYEBROW, color: '#ffea00',               width: 1.5 },
      { connections: LIPS,          color: '#ff4081',               width: 1.5 },
      { connections: NOSE,          color: '#ff9800',               width: 1   },
    ];

    // ── Decode / draw ────────────────────────────────────────────────────────

    function decodeFacemesh(data) {
      // 468 landmarks × 3 float32 LE = 5616 bytes
      const view = new DataView(data.buffer, data.byteOffset);
      const landmarks = [];
      for (let i = 0; i < 468; i++) {
        const off = i * 12;
        landmarks.push({
          x: view.getFloat32(off,     true),
          y: view.getFloat32(off + 4, true),
          z: view.getFloat32(off + 8, true),
        });
      }
      return landmarks;
    }

    function drawFacemesh(faces) {
      for (const landmarks of faces) {
        // Feature connections
        for (const { connections, color, width: lw } of FEATURES) {
          ctx.strokeStyle = color;
          ctx.lineWidth   = lw;
          for (const [a, b] of connections) {
            const la = landmarks[a], lb = landmarks[b];
            ctx.beginPath();
            ctx.moveTo(la.x * width, la.y * height);
            ctx.lineTo(lb.x * width, lb.y * height);
            ctx.stroke();
          }
        }

        // All landmark dots — size scaled by depth for subtle 3-D feel
        for (const lm of landmarks) {
          const r = Math.max(0.8, 2 - lm.z * 4);
          ctx.beginPath();
          ctx.arc(lm.x * width, lm.y * height, r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,0.35)';
          ctx.fill();
        }
      }
    }

    // ── WebSocket ────────────────────────────────────────────────────────────

    const ws = new WebSocket('ws://localhost:3000');
    ws.binaryType = 'arraybuffer';

    ws.onopen  = () => { status.textContent = 'Connected — waiting for config…'; };
    ws.onclose = () => { status.textContent = 'Disconnected'; };
    ws.onerror = () => { status.textContent = 'Connection error'; };

    ws.onmessage = (event) => {
      if (typeof event.data === 'string') {
        const msg = JSON.parse(event.data);

        if (msg.type === 'config') {
          width  = msg.width;
          height = msg.height;
          canvas.width  = width;
          canvas.height = height;
          status.textContent = `${width}×${height} — waiting for frames…`;
          return;
        }

        if (msg.type === 'events') {
          pendingFaces = msg.events
            .filter(e => e.type === 'facemesh')
            .map(e => decodeFacemesh(new Uint8Array(e.data)));
          return;
        }

        return;
      }

      // Binary: raw RGB24 frame
      if (!width || !height) return;
      const rgb  = new Uint8Array(event.data);
      const rgba = new Uint8ClampedArray(width * height * 4);
      for (let i = 0; i < width * height; i++) {
        rgba[i * 4]     = rgb[i * 3];
        rgba[i * 4 + 1] = rgb[i * 3 + 1];
        rgba[i * 4 + 2] = rgb[i * 3 + 2];
        rgba[i * 4 + 3] = 255;
      }

      ctx.putImageData(new ImageData(rgba, width, height), 0, 0);
      drawFacemesh(pendingFaces);
      pendingFaces = [];

      frames++;
      const now = Date.now();
      if (now - fpsTimer >= 1000) {
        fps    = Math.round(frames * 1000 / (now - fpsTimer));
        frames = 0;
        fpsTimer = now;
        status.textContent = `${width}×${height} — ${fps} fps`;
      }
    };
  </script>
</body>
</html>
